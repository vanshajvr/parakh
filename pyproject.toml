[project]
name = "signalforge"
version = "0.1.0"
description = "ML stock signals with receipts: calibrated, explained, and publicly scored."
requires-python = ">=3.11,<3.14"
dependencies = [
    "yfinance>=1.7",
    "pandas>=3.0",
    "numpy>=2.4",
    "ta>=0.11",
    "scikit-learn>=1.9",
    "lightgbm>=4.7",
    "shap>=0.51",
    "matplotlib>=3.11",
    "pyarrow>=26.0",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[tool.setuptools]
packages = ["ml", "jobs"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning:shap.*"]
