[project]
name = "parakh"
version = "0.1.0"
description = "ML stock signals with receipts: calibrated, explained, and publicly scored."
requires-python = ">=3.11,<3.14"
dependencies = [
    "yfinance>=1.7",
    "pandas>=3.0",
    "numpy>=2.4",
    "ta>=0.11",
    "scikit-learn>=1.9",
    "lightgbm>=4.7",
    "shap>=0.51",
    "matplotlib>=3.11",
    "pyarrow>=26.0",
    "joblib",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "python-dotenv>=1.2",
    "fastapi>=0.159",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28"]

[tool.setuptools]
packages = ["ml", "jobs", "ledger", "api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::PendingDeprecationWarning:shap.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]
