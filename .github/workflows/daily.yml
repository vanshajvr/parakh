name: Daily ledger

# After the NSE close: score matured calls and publish the next session's calls.
on:
  schedule:
    - cron: "30 12 * * 1-5" # 18:00 IST, Monday–Friday
    # Catch-up runs in case Yahoo's NIFTY 50 close arrives late. Re-running is safe, and the
    # publish window stays open until the next 09:15 IST open (decision D-015).
    - cron: "30 15 * * 1-5" # 21:00 IST, Monday–Friday
    - cron: "0 2 * * 1-6" # 07:30 IST, Monday–Saturday (the previous session's last chance)
  workflow_dispatch:

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_DAILY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[ml]"
      - run: python -m jobs.daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Heartbeat for healthchecks.io (decision D-043): an alert if a run fails, or if none arrives on schedule.
      - name: Report to healthchecks.io
        if: always() && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL${{ job.status == 'success' && '' || '/fail' }}"
