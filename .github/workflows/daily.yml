name: Daily ledger

# After the NSE close: score matured calls and publish the next session's calls.
on:
  schedule:
    - cron: "30 12 * * 1-5" # 18:00 IST, Monday–Friday
    # Catch-up runs in case Yahoo's NIFTY 50 close arrives late. Re-running is safe, and the
    # publish window stays open until the next 09:15 IST open (decision D-015).
    - cron: "30 15 * * 1-5" # 21:00 IST, Monday–Friday
    - cron: "0 2 * * 1-6" # 07:30 IST, Monday–Saturday (the previous session's last chance)
  workflow_dispatch:

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_DAILY_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[ml]"
      - run: python -m jobs.daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Rebuild the site so the time machine's static price file includes today's close (D-044).
      - name: Refresh the site's price snapshot
        if: success() && env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl -fsS -m 30 -X POST "$(printf %s "$VERCEL_DEPLOY_HOOK_URL" | tr -d '[:space:]')" > /dev/null
      # Heartbeat for healthchecks.io (decision D-043): an alert if a run fails, or if none arrives on schedule.
      - name: Report to healthchecks.io
        if: always() && env.HEALTHCHECK_URL != ''
        # Trim the URL (a pasted secret can carry a newline), and add /fail only when the job failed.
        run: |
          url=$(printf %s "$HEALTHCHECK_URL" | tr -d '[:space:]')
          suffix=""; [ "${{ job.status }}" = "success" ] || suffix="/fail"
          curl -fsS -m 10 --retry 3 "$url$suffix"
