name: Weekly retrain

# Re-run the walk-forward evaluation and publish a new model version.
on:
  schedule:
    - cron: "30 3 * * 6" # 09:00 IST, Saturday
  workflow_dispatch:

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_RETRAIN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[ml]"
      - run: python -m jobs.retrain --refresh --publish
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: |
            docs/model-card.md
            docs/img/calibration.png
            artifacts/metrics.json
      # Heartbeat for healthchecks.io (decision D-043): an alert if a run fails, or if none arrives on schedule.
      - name: Report to healthchecks.io
        if: always() && env.HEALTHCHECK_URL != ''
        # Trim the URL (a pasted secret can carry a newline), and add /fail only when the job failed.
        run: |
          url=$(printf %s "$HEALTHCHECK_URL" | tr -d '[:space:]')
          suffix=""; [ "${{ job.status }}" = "success" ] || suffix="/fail"
          curl -fsS -m 10 --retry 3 "$url$suffix"
